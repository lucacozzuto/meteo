name: Update Meteo Data and Plots

on:
  push:
    branches: [ main ]
  schedule:
    # Esegue ogni giorno alle 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Permette di avviare il workflow manualmente

jobs:
  update-and-plot:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Serve per poter fare push sul branch

    env:
      MPLBACKEND: Agg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update data (update_meteo.py)
        run: python update_meteo.py

      - name: Generate plots
        run: |
          python plot_records_yearly.py
          python plot_records_yearly_italy.py
          python plot_hot_days_europe.py
          python plot_hot_days_italy.py
          python plot_tropical_nights_europe.py
          python plot_tropical_nights_italy.py
          python plot_extreme_rain_europe.py
          python plot_extreme_rain_italy.py
          python plot_records_yearly_min_europe.py
          python plot_records_yearly_min_italy.py
          python plot_heatwaves_europe.py
          python plot_heatwaves_italy.py
          python plot_night_heatwaves_europe.py
          python plot_night_heatwaves_italy.py
          python plot_wildfire_heatmaps.py
          python generate_wildfire_cumulative.py
          python plot_tourism_heatmap.py
          python generate_monthly_records.py
          python find_latest_records.py

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated data and plots update"
          file_pattern: "data/ data_italy/ docs/"
